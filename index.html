<!DOCTYPE html>
<html lang="pt-br">
    <head>

        <title>TACO</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="barra-navegacao">
            <img src="assets/images.png" alt="Logo da TACO" class="icone logo">
            <nav>
                <ul class="menu">
                    <li><a href="#">Novidades</a></li>
                    <li><a href="#">Masculino</a></li>
                    <li><a href="#">Feminino</a></li>
                    <li><a href="#">kids</a></li>

                    <li><a href="#">acessórios</a></li>

                <img src="assets/shorts.png" alt="Imagem de shorts" class="imagem shorts">
                <img src="assets/camisa.png" alt="Imagem de camisa" class="imagem camisa">
                <img src="assets/polo.png" alt="Imagem de polo" class="imagem polo">
